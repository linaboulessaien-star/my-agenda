name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet Android
        run: |
          flutter create --org com.monplanning --project-name mon_planning --platforms=android build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
          pip install pillow
          SCRIPT=prepare_android.py
          if [ -f tools/prepare_android.py ]; then SCRIPT=tools/prepare_android.py; fi
          ICON=.
          if [ -f icon/icon.png ]; then ICON=icon; fi
          python3 $SCRIPT build_app $ICON

      - name: Installer les dépendances
        working-directory: build_app
        run: flutter pub get

      - name: Construire l'APK
        working-directory: build_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mon-planning-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
